name: release

# Compile Heim pour chaque machine, publie une release GitHub (que les Heim installés
# proposent en mise à jour), puis fabrique l'image SD. Deux façons de lancer une release :
#  - monter `version` dans Cargo.toml et pousser sur main : le tag vX.Y.Z est créé ici même ;
#  - pousser un tag « vX.Y.Z » (ou créer la release sur GitHub), comme avant.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["Cargo.toml"]
  workflow_dispatch:
    inputs:
      image:
        description: "Fabriquer aussi l'image SD"
        type: boolean
        default: true

# Par défaut, lecture seule ; seules les étapes qui publient la release ont le droit d'écrire.
permissions:
  contents: read

env:
  # Gravé dans le binaire : le dépôt où chercher les mises à jour.
  HEIM_REPO: ${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    # Le droit d'écrire sert seulement à créer le tag quand la version change sur main.
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - name: Version, tag et release
        id: v
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "v$v" = "${GITHUB_REF_NAME%%-*}" -o "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME ≠ version $v"; exit 1; }
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
              echo "v$v existe déjà : pas de nouvelle release."
              echo "release=false" >> "$GITHUB_OUTPUT"
            else
              # Un tag créé avec GITHUB_TOKEN ne relance pas ce workflow : tout se fait ici.
              git tag "v$v" "$GITHUB_SHA"
              git push origin "v$v"
              echo "tag=v$v" >> "$GITHUB_OUTPUT"
              echo "release=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  linux:
    needs: check
    if: needs.check.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            asset: heim-aarch64-linux      # Pi 3, Pi 4, Pi 5, Pi Zero 2 W en 64 bits
          - target: armv7-unknown-linux-musleabihf
            asset: heim-armv7-linux        # Raspberry Pi OS 32 bits
          - target: x86_64-unknown-linux-musl
            asset: heim-x86_64-linux       # mini PC
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: pip install ziglang cargo-zigbuild
      - run: cargo zigbuild --release --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/heim ${{ matrix.asset }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  windows:
    needs: check
    if: needs.check.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: copy target\release\heim.exe heim-x86_64-windows.exe
      - uses: actions/upload-artifact@v7
        with:
          name: heim-x86_64-windows.exe
          path: heim-x86_64-windows.exe

  publish:
    permissions:
      contents: write
    needs: [check, linux, windows]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Les fichiers système de la box, que heim-system applique sans reflasher.
      - name: Archive des fichiers système
        run: |
          mkdir -p sys && cp packaging/rootfs/* packaging/system/apply.sh sys/
          chmod +x sys/heim-guard sys/heim-system sys/apply.sh
          tar -czf dist/heim-system.tar.gz -C sys .
      - run: cd dist && sha256sum heim-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          tag_name: ${{ needs.check.outputs.tag }}
          prerelease: ${{ contains(needs.check.outputs.tag, '-') }}

  image:
    permissions:
      contents: write
    needs: [check, linux, publish]
    if: ${{ !failure() && !cancelled() && (needs.check.outputs.release == 'true' || inputs.image) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: heim-aarch64-linux
          path: dist
      - name: Fichiers de l'étape Heim
        run: |
          f=packaging/pi-gen/stage-heim/00-heim/files
          # Depuis Windows, git peut perdre le droit d'exécution des scripts.
          chmod +x packaging/pi-gen/stage-heim/prerun.sh packaging/pi-gen/stage-heim/00-heim/01-run.sh packaging/pi-gen/stage-heim/01-zigbee2mqtt/01-run-chroot.sh packaging/rootfs/heim-guard packaging/rootfs/heim-system
          install -m 755 dist/heim-aarch64-linux $f/heim
          cp packaging/rootfs/* $f/
          echo "${{ github.repository }}" > $f/heim-repo
      # Place disque : on supprime nous-mêmes les gros outils inutiles du runner. L'option
      # increase-runner-disk-size de pi-gen-action passe par apt et casse sur les runners
      # récents (« sudo failed with exit code 100 »).
      - name: Libérer de la place sur le disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup || true
          sudo docker image prune --all --force || true
          df -h /
      - uses: usimd/pi-gen-action@v1
        id: build
        with:
          image-name: heim-${{ needs.check.outputs.tag || github.ref_name }}
          # Branche « arm64 » = Debian 13 (trixie) depuis fin 2025 : la mélanger avec
          # release bookworm casse les clés Debian (NO_PUBKEY). On prend la branche bookworm.
          pi-gen-version: bookworm-arm64
          release: bookworm
          stage-list: stage0 stage1 stage2 ./packaging/pi-gen/stage-heim
          hostname: heim
          username: heim-admin
          # Compte du système (console / SSH, coupé par défaut). Mot de passe : secret PI_PASSWORD, sinon « heim ».
          password: ${{ secrets.PI_PASSWORD || 'heim' }}
          disable-first-boot-user-rename: 1
          enable-ssh: 0
          locale: fr_FR.UTF-8
          keyboard-keymap: fr
          keyboard-layout: French
          timezone: Europe/Paris
          wpa-country: FR
          compression: xz
          increase-runner-disk-size: false
      - uses: softprops/action-gh-release@v2
        if: needs.check.outputs.release == 'true'
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          files: ${{ steps.build.outputs.image-path }}
      - uses: actions/upload-artifact@v7
        if: needs.check.outputs.release != 'true'
        with:
          name: image-sd
          path: ${{ steps.build.outputs.image-path }}
