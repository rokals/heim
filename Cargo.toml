[package]
name = "heim"
version = "0.15.0"
edition = "2024"
license = "Apache-2.0"
description = "Heim - noyau domotique léger en Rust (cible : Raspberry Pi Zero 2 W, 512 Mo)"
rust-version = "1.89"

[lib]
path = "src/lib.rs"

[[bin]]
name = "heim"
path = "src/main.rs"

[features]
default = ["webhook"]
# Notifications sortantes en HTTP(S). Désactivable pour un binaire encore plus petit.
webhook = ["dep:reqwest"]

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
futures-util = "0.3.34"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
rumqttc = { version = "0.25.1", default-features = false }
# Broker MQTT intégré : les paquets sont décodés par rumqttc, bytes vient avec.
bytes = "1"
# La configuration de Zigbee2MQTT (configuration.yaml).
yaml_serde = "0.10"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
sha2 = "0.11"
# Comptes : mots de passe hachés (PBKDF2), jetons de session aléatoires.
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
getrandom = "0.2"
# Notifications push (Web Push) : signature VAPID et chiffrement du message (RFC 8291).
p256 = { version = "0.14", features = ["ecdh", "ecdsa"] }
aes-gcm = "0.11"
hkdf = "0.13"
base64 = "0.23"
# Tuya local : AES-ECB (3.3/3.4), HMAC-SHA256 (3.4), CRC32, clé de découverte MD5.
aes = "0.9"
hmac = "0.13"
md-5 = "0.11"
crc32fast = "1"
# Matter : client WebSocket du serveur Matter.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "process", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
