istant address`,"Jeton d'accès longue durée":`Long-lived access token`,"Dans Home Assistant : votre profil (en bas à gauche) › Sécurité › Jetons d'accès longue durée › Créer un jeton. Le compte doit être administrateur. Heim ne garde pas ce jeton.":`In Home Assistant: your profile (bottom left) › Security › Long-lived access tokens › Create token. The account must be an administrator. Heim doesn’t keep this token.`,Avancé:`Advanced`,"Sujet de base de Zigbee2MQTT":`Zigbee2MQTT base topic`,"Se connecter":`Connect`,"Reprendre Zigbee2MQTT et les pièces":`Take over Zigbee2MQTT and the rooms`,"{n} appareil(s) repris, {r} pièce(s) ajoutée(s)":`{n} device(s) taken over, {r} room(s) added`,"Sauvegarde en cours…":`Backing up…`,"Arrêter Zigbee2MQTT dans Home Assistant":`Stop Zigbee2MQTT in Home Assistant`,"Arrêter le module {name}":`Stop the {name} add-on`,"Pensez aussi à couper son démarrage automatique dans Home Assistant (Paramètres › Modules complémentaires).":`Also turn off its start on boot in Home Assistant (Settings › Add-ons).`,"Arrêtez-le vous-même (module complémentaire ou conteneur Docker) : une clé et un réseau Zigbee ne servent qu'à un seul Zigbee2MQTT à la fois.":`Stop it yourself (add-on or Docker container): a Zigbee stick and network serve only one Zigbee2MQTT at a time.`,"C'est fait":`Done`,"Déplacer la clé Zigbee":`Move the Zigbee stick`,"Débranchez la clé de la machine Home Assistant, branchez-la sur la box, choisissez-la ci-dessous et démarrez Zigbee sur la box. Les appareils reviennent sans réappairage (les appareils sur pile peuvent mettre quelques minutes).":`Unplug the stick from the Home Assistant machine, plug it into the box, pick it below and start Zigbee on the box. Devices come back without re-pairing (battery devices can take a few minutes).`,"Débranchez la clé de la machine Home Assistant, branchez-la sur la box, choisissez-la ci-dessus et démarrez Zigbee sur la box. Les appareils reviennent sans réappairage (les appareils sur pile peuvent mettre quelques minutes).":`Unplug the stick from the Home Assistant machine, plug it into the box, pick it above and start Zigbee on the box. Devices come back without re-pairing (battery devices can take a few minutes).`,"Appareils Wi-Fi branchés sur le broker MQTT de Home Assistant (Tasmota, Shelly, ESPHome) : réglez-les sur l'adresse de la box, port 1883, et ouvrez le broker de Heim au réseau. Tuya se reprend dans Réglages › Connexions › Tuya.":`Wi-Fi devices on Home Assistant’s MQTT broker (Tasmota, Shelly, ESPHome): point them at the box’s address, port 1883, and open Heim’s broker to the network. Tuya is taken over in Settings › Connections › Tuya.`,"Sans jeton : passer directement par le broker MQTT":`Without a token: go straight through the MQTT broker`,"L'adresse et un compte du broker MQTT où tourne Zigbee2MQTT (dans Home Assistant : le module Mosquitto, et un utilisateur de Home Assistant). Zigbee2MQTT doit tourner.":`The address and an account of the MQTT broker Zigbee2MQTT uses (in Home Assistant: the Mosquitto add-on, and a Home Assistant user). Zigbee2MQTT must be running.`,"Adresse (192.168.1.10)":`Address (192.168.1.10)`,"arrêtez maintenant Zigbee2MQTT sur l'autre machine, puis déplacez la clé sur la box.":`now stop Zigbee2MQTT on the other machine, then move the stick to the box.`,"Passer par Home Assistant":`Go through Home Assistant`,"QR code expiré : recommencez":`QR code expired: try again`,"{n} appareil(s) Tuya repris":`{n} Tuya device(s) taken over`,"Reprendre les appareils de Smart Life":`Take over your Smart Life devices`,"Le plus simple : Heim lit une fois vos appareils et leurs clés locales dans votre compte Smart Life (ou Tuya Smart), puis les pilote en local. Les jetons du cloud ne sont pas gardés.":`The easiest way: Heim reads your devices and their local keys once from your Smart Life (or Tuya Smart) account, then controls them locally. Cloud tokens aren’t kept.`,"Ouvrez Smart Life sur votre téléphone, touchez le bouton de scan (en haut à droite de l'accueil).":`Open Smart Life on your phone and tap the scan button (top right of the home screen).`,"Scannez ce QR code, puis confirmez la connexion dans l'appli.":`Scan this QR code, then confirm the login in the app.`,"Heim attend la confirmation et reprend les appareils tout seul.":`Heim waits for the confirmation and takes the devices over by itself.`,"Code utilisateur Smart Life":`Smart Life user code`,"ex. a1B2c3":`e.g. a1B2c3`,"Dans l'appli : Moi › Réglages (roue dentée) › Compte et sécurité › Code utilisateur.":`In the app: Me › Settings (gear) › Account and Security › User Code.`,"Afficher le QR code":`Show the QR code`,"{total} appareil(s) dans le compte : {added} ajouté(s), {updated} mis à jour, {skipped} ignoré(s) (sous-appareils de passerelle, caméras…).":`{total} device(s) in the account: {added} added, {updated} updated, {skipped} skipped (gateway sub-devices, cameras…).`,"Autre méthode, avec un compte développeur Tuya :":`Another way, with a Tuya developer account:`,"Reprendre les appareils de Home Assistant":`Take over your Home Assistant devices`,"Reprendre un Zigbee2MQTT existant à partir de ses fichiers":`Take over an existing Zigbee2MQTT from its files`},Yi=[{id:`fr`,label:`Français`,locale:`fr-FR`},{id:`en`,label:`English`,locale:`en-GB`}],Xi={fr:null,en:Ji},Zi=`heim_lang`;function Qi(){try{return localStorage.getItem(Zi)}catch{return null}}function $i(){let e=typeof navigator>`u`?[]:navigator.languages??[navigator.language];for(let t of e){let e=String(t||``).slice(0,2).toLowerCase();if(e in Xi)return e}return`en`}function ea(e){return typeof e==`string`&&e in Xi?e:null}var ta=ea(Qi())??(typeof document>`u`?`fr`:$i());function na(){return ea(Qi())!==null}function ra(){return ta}function ia(){return Yi.find(e=>e.id===ta)?.locale??`fr-FR`}function aa(e,{reload:t=!0}={}){let n=ea(e);if(!n)return!1;try{localStorage.setItem(Zi,n)}catch{}return n!==ta&&(ta=n,t&&typeof location<`u`?(location.reload(),!0):!1)}function oa(e,t,n){let r=Xi[
